<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 長文摘要</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
    }

    textarea {
      width: 100%;
      height: 300px;
      padding: 10px;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      margin-top: 15px;
      padding: 12px 24px;
      font-size: 16px;
      cursor: pointer;
    }

    #result {
      margin-top: 25px;
      padding: 15px;
      border: 1px solid #ccc;
      white-space: pre-wrap;
      min-height: 100px;
    }
  </style>
</head>

<body>

  <h1>AI 長文摘要</h1>

  <textarea id="text" placeholder="把文章貼在這裡..."></textarea>

  <br>

  <button id="summarizeBtn">開始摘要</button>

  <div id="result">摘要會顯示在這裡</div>

  <script>
    document.getElementById("summarizeBtn").addEventListener("click", async () => {

      const text = document.getElementById("text").value.trim();
      const result = document.getElementById("result");

      if (!text) {
        result.textContent = "請先輸入文字";
        return;
      }

      result.textContent = "AI 摘要中，請稍候...";

      try {
        const response = await fetch("/api/summarize", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            text: text
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "摘要失敗");
        }

        result.textContent = data.summary;

      } catch (error) {
        result.textContent = "錯誤：" + error.message;
      }
    });
  </script>

</body>
</html>
